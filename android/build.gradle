buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
        playServicesLocationVersion = "21.0.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        classpath("com.google.gms:google-services:4.4.4")
        
    }
}

apply plugin: "com.facebook.react.rootproject"
 
allprojects {
    configurations.all {
        resolutionStrategy {
            force "com.facebook.fresco:fresco:3.6.0"
            force "com.facebook.fresco:imagepipeline-okhttp3:3.6.0"
            force "com.facebook.fresco:ui-common:3.6.0"
            force "com.facebook.fresco:imagepipeline:3.6.0"
            force "com.facebook.fresco:drawee:3.6.0"
            force "com.facebook.fresco:webpsupport:3.6.0"
            force "com.facebook.fresco:animated-webp:3.6.0"
        }
    }
}
